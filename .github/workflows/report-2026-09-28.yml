name: Generate 2026-09-28 valuation report

# Historical report: manually rerun only. Never publish stale cards on routine commits.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: valuation-report-2026-09-28
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build 2026-09-28 report
        env:
          PYTHONPATH: src
        run: |
          python -m valuation_monitor.app             --config watchlist.yaml             --history data/history.csv             --latest data/latest.json             --report out/report.html             --as-of-date 2026-09-28
          mkdir -p out
          cp data/latest.json out/run-latest.json
          python -c 'import json; p=json.load(open("out/run-latest.json")); print("Optional history sources:", *p.get("source_warnings", []), sep="\\n- ")'
          python scripts/render_report_image.py
          mkdir -p reports/2026-09-28
          cp out/cards/*.png reports/2026-09-28/
          python scripts/build_issue_comment.py

      - name: Publish report images to repository
        shell: bash
        run: |
          set -euo pipefail
          # Historical backfill is persistent, but this fixed-date report must not
          # overwrite the current daily snapshot with an older as-of date.
          git add reports/2026-09-28/ data/history.csv
          git restore --worktree data/latest.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "report: publish 2026-09-28 images and history [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Post 2026-09-28 report images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "${{ github.repository }}" --body-file out/issue-comment.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: valuation-report-2026-09-28
          path: |
            out/report.html
            out/cards/
            out/run-latest.json
          retention-days: 14
