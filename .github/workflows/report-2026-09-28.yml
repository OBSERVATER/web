name: Generate 2026-09-28 valuation report

on:
  push:
    paths:
      - ".github/workflows/report-2026-09-28.yml"
      - "src/valuation_monitor/public_sources.py"
      - "scripts/render_report_image.py"
      - "scripts/build_issue_comment.py"
      - "watchlist.yaml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build 2026-09-28 report
        env:
          PYTHONPATH: src
        run: |
          python -m valuation_monitor.app             --config watchlist.yaml             --history data/history.csv             --latest data/latest.json             --report out/report.html             --as-of-date 2026-09-28
          python scripts/render_report_image.py
          mkdir -p reports
          cp out/report.png reports/2026-09-28.png
          python scripts/build_issue_comment.py

      - name: Publish report image to repository
        shell: bash
        run: |
          set -euo pipefail
          git add reports/2026-09-28.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "report: add 2026-09-28 valuation image [skip ci]"
            git push
          fi

      - name: Post 2026-09-28 report image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "${{ github.repository }}" --body-file out/issue-comment.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: valuation-report-2026-09-28
          path: |
            out/report.html
            out/report.png
            data/latest.json
          retention-days: 14
