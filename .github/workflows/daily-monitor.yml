name: Daily valuation and drawdown monitor

on:
  schedule:
    # 10:30 UTC = 18:30 Asia/Shanghai; leave time for scheduler delays.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Issue #1 and persist state (unchecked = preview only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: valuation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Tomorrow market gate (Asia/Shanghai)
        id: gate
        run: python -m valuation_monitor.calendar_gate --event "${{ github.event_name }}"

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Read published event IDs and report IDs
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          if [ "$PUBLISH" = "true" ]; then
            python scripts/issue_publication.py --scan
          else
            printf '{"published_events":[],"published_reports":[]}' > out/published-issue.json
          fi

      - name: Update valuations and daily closing-price monitor
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m valuation_monitor.app --config watchlist.yaml --history data/history.csv --latest data/latest.json --report out/report.html
          python -m valuation_monitor.drawdown --config watchlist.yaml --history data/daily_prices.csv --state data/drawdown_state.json --snapshot out/price_snapshot.json --published out/published-issue.json

      - name: Build charts and Issue comment
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/render_report_image.py
          REPORT_DAY="$(python -c 'import json; print(json.load(open("data/latest.json"))["generated_at"])')"
          mkdir -p "reports/$REPORT_DAY"
          cp out/cards/*.png "reports/$REPORT_DAY/"
          python scripts/build_issue_comment.py

      - name: Persist durable drawdown outbox and report
        if: steps.gate.outputs.run == 'true' && env.PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/history.csv data/latest.json data/daily_prices.csv data/drawdown_state.json reports/
          if git diff --cached --quiet; then
            echo "No repository changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update valuation and drawdown monitor [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Publish report to GitHub Issue 1
        if: steps.gate.outputs.run == 'true' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue_publication.py --publish

      - name: Upload preview and report artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: valuation-drawdown-report
          path: |
            out/report.html
            out/cards/
            out/price_snapshot.json
            out/issue-comment.md
            data/latest.json
          retention-days: 14
