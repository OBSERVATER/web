name: Daily valuation monitor

on:
  schedule:
    - cron: "35 7 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: valuation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Update valuation data and build report
        env:
          PYTHONPATH: src
        run: |
          python -m valuation_monitor.app \
            --config watchlist.yaml \
            --history data/history.csv \
            --latest data/latest.json \
            --report out/report.html
          python scripts/build_issue_comment.py

      - name: Post GitHub Issue report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "${{ github.repository }}" --body-file out/issue-comment.md

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: valuation-report
          path: out/report.html
          retention-days: 14

      - name: Persist history
        shell: bash
        run: |
          set -euo pipefail
          git add data/history.csv data/latest.json
          if git diff --cached --quiet; then
            echo "No history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update valuation history [skip ci]"
          git push
