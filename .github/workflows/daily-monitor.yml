name: Daily valuation monitor

on:
  schedule:
    - cron: "35 7 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      send_mail:
        description: "Send the generated report by email"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: valuation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Update valuation data and build report
        env:
          PYTHONPATH: src
          SEND_MAIL_INPUT: ${{ inputs.send_mail }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ "$EVENT_NAME" == "schedule" || "$SEND_MAIL_INPUT" == "true" ]]; then
            EXTRA_ARGS="--send-mail"
          fi
          python -m valuation_monitor.app             --config watchlist.yaml             --history data/history.csv             --latest data/latest.json             --report out/report.html             $EXTRA_ARGS

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: valuation-report
          path: out/report.html
          retention-days: 14

      - name: Persist history
        shell: bash
        run: |
          set -euo pipefail
          git add data/history.csv data/latest.json
          if git diff --cached --quiet; then
            echo "No history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update valuation history [skip ci]"
          git push
