name: Daily valuation and drawdown monitor

on:
  schedule:
    # Primary: 18:30 Beijing. All times below are explicitly Asia/Shanghai.
    - cron: "30 18 * * *"
      timezone: "Asia/Shanghai"
    # Staggered GitHub-native recovery checks; publication is idempotent.
    - cron: "47 18 * * *"
      timezone: "Asia/Shanghai"
    - cron: "7,37 19 * * *"
      timezone: "Asia/Shanghai"
    - cron: "17 20,21,23 * * *"
      timezone: "Asia/Shanghai"
    # Next morning, to recover delayed or skipped evening triggers.
    - cron: "17 7 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Issue #1 and persist state (unchecked = preview only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: valuation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Log schedule origin and actual runner time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          echo "Trigger event: $TRIGGER_EVENT"
          echo "Trigger cron: ${TRIGGER_CRON:-manual} (Asia/Shanghai)"
          echo "Runner UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Runner Beijing: $(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S%z')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Scan published report/event IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue_publication.py --scan

      - name: Recover unpublished slots with newly closed market sessions
        id: gate
        run: python -m valuation_monitor.calendar_gate --event "${{ github.event_name }}"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Replay missing slots in date order
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r REPORT_DAY; do
            [ -n "$REPORT_DAY" ] || continue
            echo "::group::Scheduled date $REPORT_DAY 18:30 Beijing"
            python -m valuation_monitor.app \
              --config watchlist.yaml --history data/history.csv \
              --latest data/latest.json --report out/report.html \
              --as-of-date "$REPORT_DAY"
            python -m valuation_monitor.drawdown \
              --config watchlist.yaml --history data/daily_prices.csv \
              --state data/drawdown_state.json --snapshot out/price_snapshot.json \
              --published out/published-issue.json --as-of-date "$REPORT_DAY"
            python scripts/render_report_image.py
            mkdir -p "reports/$REPORT_DAY"
            cp out/cards/*.png "reports/$REPORT_DAY/"
            python scripts/build_issue_comment.py

            if [ "$PUBLISH" = "true" ]; then
              git add data/history.csv data/latest.json data/daily_prices.csv \
                data/drawdown_state.json reports/
              if ! git diff --cached --quiet; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git commit -m "data: update valuation and drawdown for $REPORT_DAY [skip ci]"
                git pull --rebase origin main
                git push
              fi
              python scripts/issue_publication.py --publish
              python scripts/issue_publication.py --scan
            fi
            echo "::endgroup::"
          done < out/planned-days.txt

      - name: Upload preview and report artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: valuation-drawdown-report
          path: |
            out/planned-days.txt
            out/report.html
            out/cards/
            out/price_snapshot.json
            out/issue-comment.md
            data/latest.json
          retention-days: 14
