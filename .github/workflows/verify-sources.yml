name: Verify valuation sources

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Benchmark date"
        required: true
        default: "2026-09-28"
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compare reference snapshots
        env:
          PYTHONPATH: src
        run: python scripts/verify_benchmarks.py --date "${{ inputs.date }}"
