name: Backfill public valuation candidates

on:
  push:
    paths:
      - ".github/workflows/backfill-public-candidates.yml"
      - "scripts/backfill_guzhibiao_candidates.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valuation-candidate-backfill
  cancel-in-progress: false

jobs:
  candidate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch, validate and save public candidate series
        run: python -u scripts/backfill_guzhibiao_candidates.py
      - name: Publish isolated candidate histories
        shell: bash
        run: |
          set -euo pipefail
          git add data/candidates/guzhibiao_funddb_history.csv data/candidates/guzhibiao_funddb_summary.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "research: persist independently labelled public valuation histories [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: audited-public-valuation-candidates
          path: data/candidates/
          retention-days: 30
