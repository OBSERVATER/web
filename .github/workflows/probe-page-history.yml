name: Probe public page embedded histories
on:
  push:
    paths:
      - ".github/workflows/probe-page-history.yml"
      - "scripts/probe_page_history.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_page_history.py
