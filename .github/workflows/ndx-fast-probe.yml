name: Quick NDX source verification

on:
  push:
    branches:
      - feature/daily-drawdown-20261026
    paths:
      - .github/workflows/ndx-fast-probe.yml
      - scripts/probe_nasdaq100_fast.py

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python libraries
        run: pip install -r requirements.txt
      - name: Verify NDX price and ten-year PE history
        env:
          PYTHONPATH: src
        run: python scripts/probe_nasdaq100_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasdaq100-fast-probe
          path: out/nasdaq100_fast_probe.json
          retention-days: 7
