settings:
  timezone: Asia/Shanghai
  history_years: 10
  frequency: weekly
  minimum_history_weeks: 450

instruments:
  - id: value100
    name: 价值100
    market: cn
    code: "980081"
    metrics:
      pe_ttm: {}
    source:
      type: chain
      sources:
        - type: danjuan
          name: 价值100
        - type: cni

  - id: csi_dividend
    name: 中证红利
    market: cn
    code: "000922"
    metrics:
      dyr: {}
    source:
      type: csindex_indicator
      dyr_field: dyr2

  - id: hscgsi
    name: 恒生消费
    market: hk
    code: "HSCGSI"
    metrics:
      pb: {}
    source:
      type: public_page
      url: "https://getstockcheck.com/en/index/HSCGSI.HK/"
      patterns:
        pb: "(?:P/B|Price.?to.?Book|PB)[^0-9]{0,40}([0-9]+(?:\\.[0-9]+)?)"
      percentile_patterns:
        pb: "P/B\\s+sits\\s+at\\s+the\\s+([0-9]+(?:\\.[0-9]+)?)th\\s+percentile\\s+over\\s+the\\s+trailing\\s+10Y"

  - id: pharma50
    name: 医药50
    market: cn
    code: "931140"
    metrics:
      pb: {}
    source:
      type: danjuan
      name: 医药50
      index_code: "CSI931140"

  - id: hstech
    name: 恒生科技
    market: hk
    code: "HSTECH"
    metrics:
      ps_ttm: {}
    source:
      type: public_page
      url: "https://baifenwei.com/index/hstech/"
      patterns:
        ps_ttm: "(?:市销率(?:TTM)?|PS(?:-TTM)?)[^0-9]{0,50}([0-9]+(?:\\.[0-9]+)?)"
      percentile_patterns:
        ps_ttm: "当前\\s*PS\\s*处于近\\s*10\\s*年约\\s*([0-9]+(?:\\.[0-9]+)?)%\\s*分位"

  - id: sp500
    name: 标普500
    market: us
    code: "SP500"
    metrics:
      pe_ttm: {}
    source:
      type: danjuan
      name: 标普500
      index_code: "SP500"
